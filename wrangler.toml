name = "letyourpassionschooseyou-com-v1"
compatibility_date = "2026-06-25"
workers_dev = false
preview_urls = false
main = "src/worker.js"

[[routes]]
pattern = "letyourpassionschooseyou.com"
custom_domain = true

[[routes]]
pattern = "www.letyourpassionschooseyou.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Disable Cloudflare HTML redirects (/index.html→/, /404.html→/404) that
# Search Console reports as "Page with redirect". The Worker serves "/" from
# index.html and returns a real 404 for the 404 document paths.
html_handling = "none"
not_found_handling = "404-page"
run_worker_first = true
